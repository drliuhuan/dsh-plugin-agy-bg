name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Syntax check
        run: npm run check
      - name: client.js is up to date
        run: |
          node build.mjs
          git diff --exit-code -- client.js
      - name: Publish
        run: npm publish --access public
